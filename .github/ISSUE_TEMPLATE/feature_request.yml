name: Feature request
description: Suggest a new tool, resource, or improvement
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What do you want to add or change?
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Use case / why
      description: What AWS operation or question do you want to be able to ask through Claude?
    validations:
      required: false
  - type: textarea
    id: approach
    attributes:
      label: Proposed approach
      description: Which AWS API calls would this need? Any thoughts on the tool interface? (optional)
    validations:
      required: false
