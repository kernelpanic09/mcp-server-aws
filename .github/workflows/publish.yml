# Requires Trusted Publishing configured at https://pypi.org/manage/account/publishing/
# Project: mcp-server-aws
# Owner: kernelpanic09
# Repository: mcp-server-aws
# Workflow: publish.yml
# Environment: pypi
#
# To publish: git tag v1.x.x && git push origin v1.x.x

name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  build-and-publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Build
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
