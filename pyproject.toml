[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-server-aws"
version = "1.0.0"
description = "MCP server for AWS - lets AI clients query AWS resources over stdio"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "kernelpanic09", email = "103852527+kernelpanic09@users.noreply.github.com" },
]
keywords = ["mcp", "aws", "claude", "ai"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=1.0.0",
    "boto3>=1.34.0",
    "pydantic>=2.0",
]

[project.scripts]
mcp-server-aws = "mcp_server_aws.__main__:main"

[project.urls]
Homepage = "https://github.com/kernelpanic09/mcp-server-aws"
Repository = "https://github.com/kernelpanic09/mcp-server-aws"
Issues = "https://github.com/kernelpanic09/mcp-server-aws/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "moto[ec2,s3,iam,logs,cloudwatch,eks,ce,cloudformation,rds]>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "boto3-stubs[essential]>=1.34.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server_aws"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
